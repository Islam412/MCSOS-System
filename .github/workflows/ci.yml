name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/check-api-contract.mjs --expect-fail
      - run: node scripts/check-api-contract.mjs swagger.snapshot.json
      - run: npm run build
